<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Administrare · Homosapiens</title>
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--surface-2:#EAECF0;--surface-3:#E1E4EA;--ink:#111317;--ink-2:#353943;--muted:#5D626E;--line:#DCDFE5;--line-2:#C9CDD5;
  --blue:#2D4E8A;--blue-soft:#DCE2EE;--ok:#1F7A4D;--ok-soft:#DDF1E6;--danger:#B42318;--danger-soft:#FBE4E1;--warn:#8A5A00;--warn-soft:#FBEFD5;
  --logo-f:brightness(0);--logo-o:.8;
  --f-display:'Bricolage Grotesque','Manrope',system-ui,sans-serif;--f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);--r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E0F12;--surface:#16181D;--surface-2:#1D2026;--surface-3:#252932;--ink:#F1F2F4;--ink-2:#C8CBD2;--muted:#979BA6;--line:#282B33;--line-2:#363A44;
  --blue:#A3B4DC;--blue-soft:#1D2333;--ok:#6FD3A0;--ok-soft:#15281F;--danger:#FDA29B;--danger-soft:#2A1614;--warn:#F4C66B;--warn-soft:#2A2213;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1180px;margin:0 auto}
.hidden{display:none!important}

/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding-block:32px}
.login-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px;padding:32px 28px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:0 30px 60px -34px rgba(24,33,52,.3)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:40px;height:40px}
.brand b{display:block;font:800 18px/1.1 var(--f-display);letter-spacing:-.02em}
.brand span{font-size:12.5px;color:var(--muted);font-weight:700}
.login h1{font:800 26px/1.1 var(--f-display);letter-spacing:-.03em}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:800;color:var(--muted)}
.in,.sel{width:100%;min-height:42px;padding:9px 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg);outline:none;transition:border-color .2s,box-shadow .2s}
.in:focus,.sel:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.in.empty{border-color:color-mix(in srgb,var(--danger) 55%,var(--line-2))}
.msg{padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600}
.msg.err{background:var(--danger-soft);color:var(--danger)}
.msg.info{background:var(--surface-2);color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid transparent;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap;transition:transform .2s var(--ease),background-color .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-ghost{background:transparent;border-color:var(--line-2);color:var(--ink)}
a.btn{text-decoration:none;color:var(--ink)}
.btn-soft{background:var(--surface-2)}
.btn-danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.btn-sm{min-height:34px;padding:0 12px;font-size:13px}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2)}
.ib:hover{border-color:var(--line-2)}
.ib.del:hover{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.ib:disabled{opacity:.35;cursor:default}

/* app */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:66px}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.who{font-size:13px;color:var(--muted);font-weight:700}
.who b{color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:none}
.tab{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:22px 0 18px}
.head h2{font:800 clamp(24px,3vw,32px)/1.1 var(--f-display);letter-spacing:-.03em}
.head p{color:var(--muted);max-width:64ch;margin-top:6px}
main{padding-bottom:120px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.season{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.season.off{opacity:.62}
.srow{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.srow .field{flex:1 1 160px}
.acts{display:flex;gap:6px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:800;font-size:13.5px;cursor:pointer;user-select:none;white-space:nowrap}
.chk input{width:18px;height:18px;accent-color:var(--ink);margin:0}
.chk.on{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.awards{display:flex;flex-direction:column;gap:10px}
.aw{display:grid;gap:10px;padding:14px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.aw.off{opacity:.6}
.g4{display:grid;grid-template-columns:auto minmax(0,1.6fr) minmax(0,.7fr) minmax(0,.8fr) auto;gap:10px;align-items:end}
.g2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.9fr);gap:10px}
details.tr{border-top:1px dashed var(--line-2);padding-top:8px}
details.tr summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--muted);list-style:none}
details.tr summary::-webkit-details-marker{display:none}
details.tr summary::before{content:"+ "}
details.tr[open] summary::before{content:"− "}
.trg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.hint{font-size:13px;color:var(--muted)}
.empty-note{padding:14px;border-radius:14px;border:1px dashed var(--line-2);color:var(--muted);font-size:14px}
@media(max-width:820px){.g4{grid-template-columns:1fr 1fr}.g4 .chk{grid-column:1/-1;justify-self:start}.g4 .nm{grid-column:1/-1}.g4 .acts{grid-column:1/-1}.g2,.trg{grid-template-columns:1fr}}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:460px){.grid{grid-template-columns:1fr}}
.person,.spon{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.person.off,.spon.off{opacity:.62}
.ph{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.ph .ini{font:800 44px/1 var(--f-display);letter-spacing:-.04em;color:var(--ink-2)}
.ph-acts{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;justify-content:center}
.ph-acts .btn{background:color-mix(in srgb,var(--surface) 92%,transparent);border-color:var(--line);backdrop-filter:blur(6px)}
.busy::after{content:"Se încarcă…";position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--surface) 80%,transparent);font-weight:800}
.row2{display:flex;gap:6px;flex-wrap:wrap}
.lg{display:grid;grid-template-columns:1fr 1fr;border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative}
.lg .half{display:grid;place-items:center;height:96px;padding:12px}
.lg .lt{background:#F4F5F7}.lg .dk{background:#16181D}
.lg img{max-width:100%;max-height:56px;height:auto;width:auto}
.lg .lt img.mono{filter:brightness(0);opacity:.8}
.lg .word{font:800 18px/1 var(--f-display);letter-spacing:-.03em;text-align:center}
.lg .lt .word{color:#111317}.lg .dk .word{color:#F1F2F4}
.spon .row2 .btn{flex:1}

/* history */
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.hrow b{font-weight:800}
.hrow span{color:var(--muted);font-size:13.5px}

/* messages */
.mstate{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:18px;margin-bottom:16px;border:1px solid var(--line)}
.mstate.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.mstate.ok{background:var(--ok-soft);border-color:transparent}
.mstate b{font-weight:800}
.mstate ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.mstate .row2{align-items:center}
.msgs{display:flex;flex-direction:column;gap:12px}
.mcard{display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.mcard.done{opacity:.72}
.mhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mhead b{font:800 17px/1.2 var(--f-display);letter-spacing:-.01em}
.tag{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border-radius:999px;background:var(--surface-2);font-size:12px;font-weight:800;margin-left:6px;vertical-align:2px}
.tag.new{background:var(--blue-soft);color:var(--blue)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.mmeta{font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.mmeta a{color:var(--blue);font-weight:700}
.msubj{font-weight:800}
.mbody{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px 14px;border-radius:12px;background:var(--bg)}
.mfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mfoot .acts{flex-wrap:wrap}

/* save bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.state{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.dirty .dot{background:var(--warn)}
.bar-acts{display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:40;max-width:min(92vw,520px);padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:0 20px 40px -20px rgba(0,0,0,.4);animation:tIn .35s var(--ease)}
.toast.ok{background:var(--ok);color:#fff}.toast.err{background:var(--danger);color:#fff}
@keyframes tIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
/* v3: sections, contacts, bank accounts, robots */
.sect{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.sect h3{font:800 19px/1.2 var(--f-display);letter-spacing:-.02em}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rec{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rec.on{border-color:transparent;background:var(--ok-soft)}
.rec .hint{max-width:72ch;margin-top:4px}
.rows{display:flex;flex-direction:column;gap:10px}
.prow,.brow{display:grid;gap:10px;align-items:end;padding:14px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.prow.off,.brow.off{opacity:.6}
.prow{grid-template-columns:56px minmax(0,1.3fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,1.1fr)}
.brow{grid-template-columns:minmax(0,.7fr) minmax(0,1.7fr) minmax(0,1.2fr) minmax(0,.9fr)}
.rfoot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.av{width:56px;height:56px;border-radius:14px;object-fit:cover;object-position:center 25%;background:var(--surface-2);display:grid;place-items:center;font:800 18px var(--f-display);color:var(--ink-2)}
.hint.ok{color:var(--ok);font-weight:700}.hint.bad{color:var(--danger);font-weight:700}
textarea.in{min-height:88px;resize:vertical;line-height:1.45;padding-top:10px}
.trg1{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.bot{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.bot.off{opacity:.62}
.stage{position:relative;aspect-ratio:5/4;border-radius:14px;overflow:hidden;display:grid;place-items:center;padding:14px;background:radial-gradient(90% 85% at 50% 42%,#fff,#E6E9EF)}
.stage img{max-width:100%;max-height:100%;object-fit:contain}
.stage .hint{color:#5D626E}
@media(max-width:980px){.prow{grid-template-columns:56px minmax(0,1fr) minmax(0,1fr)}.prow .wide{grid-column:2/-1}.brow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.brow .wide{grid-column:1/-1}.grid.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.prow{grid-template-columns:56px minmax(0,1fr)}.prow > .field{grid-column:1/-1}.brow{grid-template-columns:1fr}.grid.g3{grid-template-columns:1fr}}
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);padding:16px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  'use strict';
  const ROLES = [['software', 'Software (programare)'], ['hardware', 'Hardware (inginerie și CAD)'], ['pr', 'PR'], ['peer', 'Peer mentor'], ['member', 'Membru']];
  const OLD_ROLES = { prog: 'software', eng: 'hardware', cad: 'hardware', hwcad: 'hardware', drive: 'hardware', driveEng: 'hardware', prLead: 'pr' };
  const CURS = [['RON', 'Lei (RON)'], ['EUR', 'Euro (EUR)'], ['USD', 'Dolari (USD)'], ['GBP', 'Lire (GBP)']];
  const BANKS = { BTRL: 'Banca Transilvania', REVO: 'Revolut', BRDE: 'BRD', RNCB: 'BCR', INGB: 'ING Bank', RZBR: 'Raiffeisen Bank', CECE: 'CEC Bank', BACX: 'UniCredit Bank', OTPV: 'OTP Bank', BREL: 'Libra Internet Bank', UGBI: 'Garanti BBVA', PIRB: 'First Bank', CARP: 'Patria Bank', TREZ: 'Trezoreria Statului' };
  const DEF_SETTINGS = { recruiting: false, email: 'team@homosapiens.ro' };
  const V3_KEYS = ['settings', 'contacts', 'bank', 'robots'];
  const COUNTRIES = [
    ['ro', 'România'], ['us', 'SUA'], ['it', 'Italia'], ['de', 'Germania'], ['fr', 'Franța'], ['es', 'Spania'], ['gb', 'Marea Britanie'],
    ['gr', 'Grecia'], ['hu', 'Ungaria'], ['pl', 'Polonia'], ['tr', 'Turcia'], ['md', 'Republica Moldova'], ['bg', 'Bulgaria'], ['nl', 'Țările de Jos'], ['', 'Fără țară']
  ];
  const PLACES = [[0, 'Fără loc'], [1, 'Locul 1'], [2, 'Locul 2'], [3, 'Locul 3']];
  const TABS = [['premii', 'Premii'], ['roboti', 'Roboți'], ['echipa', 'Echipa'], ['sponsori', 'Sponsori'], ['contact', 'Contact și conturi'], ['mesaje', 'Mesaje'], ['istoric', 'Istoric']];
  const TOPIC_RO = { sponsor: 'Sponsorizare', collab: 'Colaborare', press: 'Presă', other: 'Altceva' };
  const SUPPORT_RO = { money: 'Financiar', goods: 'Produse sau materiale', services: 'Servicii', mentoring: 'Mentorat sau vizite' };
  const AMOUNT_RO = { a1: 'Sub 1.000 lei', a2: '1.000-5.000 lei', a3: '5.000-10.000 lei', a4: 'Peste 10.000 lei' };
  const LANGS = [['en', 'English'], ['fr', 'Français'], ['zh', '中文']];

  const S = { user: null, data: null, saved: '', meta: null, tab: 'premii', fromDefault: false, originals: {}, busy: {}, msgNew: 0, cut: {} };
  const app = document.getElementById('app');

  /* ---------- tiny DOM helper ---------- */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else if (k === 'text') el.textContent = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    return el;
  }
  const icon = (d) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', '16'); s.setAttribute('height', '16'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round'); const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d); s.append(p); return s; };
  const I = { up: 'M12 19V5M6 11l6-6 6 6', down: 'M12 5v14M6 13l6 6 6-6', left: 'M19 12H5M11 6l-6 6 6 6', right: 'M5 12h14M13 6l6 6-6 6', del: 'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3', plus: 'M12 5v14M5 12h14' };
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const initials = (n) => { const w = String(n || '').trim().split(/\s+/).filter(Boolean); if (!w.length) return '?'; return (w.length === 1 ? w[0].slice(0, 2) : w[0][0] + w[w.length - 1][0]).toUpperCase(); };

  /* ---------- API ---------- */
  async function api(path, opts = {}) {
    const res = await fetch(path, Object.assign({ credentials: 'same-origin', cache: 'no-store' }, opts));
    if (res.status === 401 && path !== '/api/login' && path !== '/api/me') { showRelogin(); throw new Error('auth'); }
    return res;
  }
  async function readErr(res) { try { const j = await res.json(); return j.message || 'Eroare.'; } catch { return 'Eroare (' + res.status + ').'; } }

  /* ---------- toast ---------- */
  let toastTimer = null;
  function toast(text, kind = 'ok') {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const t = h('div', { class: 'toast ' + kind, role: 'status' }, text);
    document.body.append(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.remove(), kind === 'err' ? 6000 : 3200);
  }

  /* ---------- login ---------- */
  function loginCard(onDone, note) {
    const msg = h('p', { class: 'msg err hidden', role: 'alert' });
    const u = h('input', { class: 'in', id: 'u', name: 'username', autocomplete: 'username', autocapitalize: 'none', spellcheck: 'false', required: true });
    const p = h('input', { class: 'in', id: 'p', name: 'password', type: 'password', autocomplete: 'current-password', required: true });
    const go = h('button', { class: 'btn btn-primary', type: 'submit' }, 'Intră');
    const form = h('form', { class: 'login-card', onsubmit: async (e) => {
      e.preventDefault();
      msg.classList.add('hidden'); go.disabled = true;
      try {
        const res = await fetch('/api/login', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ user: u.value, pass: p.value }) });
        if (!res.ok) { msg.textContent = await readErr(res); msg.classList.remove('hidden'); go.disabled = false; p.select(); return; }
        const j = await res.json(); S.user = j.user; onDone();

  async function makeLogo(file, mono) {

  async function makeCutout(file, removeBg) {
    const img = await decode(file);
    let scale = Math.min(1, 1000 / Math.max(img.width, img.height));
    for (let attempt = 0; attempt < 4; attempt++) {
      const w = Math.max(1, Math.round(img.width * scale)), hh = Math.max(1, Math.round(img.height * scale));
      const c = document.createElement('canvas'); c.width = w; c.height = hh;

            for (const q of nb) if (q >= 0 && !seen[q] && white(q)) { seen[q] = 1; stack.push(q); }
          }

        for (let px = 0; px < w; px++) { for (const p of [px, (hh - 1) * w + px]) if (!seen[p] && white(p)) fill(p, true); }
        for (let py = 0; py < hh; py++) { for (const p of [py * w, py * w + w - 1]) if (!seen[p] && white(p)) fill(p, true); }
        for (let p = 0; p < N; p++) if (!seen[p] && white(p)) fill(p, false);

        let near = bg;
        for (let r = 0; r < 2; r++) {
          const nx = new Uint8Array(N);
          for (let p = 0; p < N; p++) {
            if (near[p]) { nx[p] = 1; continue; }
            const px = p % w;
            if ((px > 0 && near[p - 1]) || (px < w - 1 && near[p + 1]) || (p >= w && near[p - w]) || (p < N - w && near[p + w])) nx[p] = 1;
          }
          near = nx;
        }

        x.putImageData(id, 0, 0);

  function viewMessages() {
    const box = h('div');

    box.append(h('div', { class: 'head' }, h('div', null, h('h2', null, 'Mesaje'), h('p', null, 'Ce trimit vizitatorii prin formularul de contact de pe site, cel mai nou primul. Când trimiterea pe email e activă, fiecare mesaj ajunge și în inboxul echipei.'))), state, list);
    const fmt = new Intl.DateTimeFormat('ro-RO', { dateStyle: 'medium', timeStyle: 'short' });
    const load = async () => {
      try {
        const res = await api('/api/admin/messages');
        const j = await res.json();
        setMsgCount(j.items.filter((m) => m.status !== 'done').length);
        state.replaceChildren(mailStatus(j.mail, async (e) => {
          const btn = e.currentTarget; btn.disabled = true; btn.textContent = 'Se trimite…';
          try {
            const r = await api('/api/admin/mail-test', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' });

            if (rj.ok) toast('Emailul de test a plecat spre ' + j.mail.to + '. Verifică inboxul (și Spam).');
            else toast('Emailul de test nu a plecat: ' + (rj.code || 'eroare') + '.', 'err');
          } catch (x) { if (x.message !== 'auth') toast('Nu mă pot conecta la server.', 'err'); }
          load();
        }));
        list.replaceChildren();
        if (!j.items.length) { list.append(h('p', { class: 'empty-note' }, 'Niciun mesaj încă. Când cineva scrie din pagina Contact, mesajul apare aici.')); return; }
        for (const m of j.items) {
          const extra = [];
          if (m.support && m.support.length) extra.push('Sprijin: ' + m.support.map((x) => SUPPORT_RO[x] || x).join(', '));
          if (m.amount) extra.push('Sumă: ' + (AMOUNT_RO[m.amount] || m.amount));
          if (m.lang && m.lang !== 'ro') extra.push('Limba site-ului: ' + m.lang.toUpperCase());
          const reply = 'mailto:' + m.email + '?subject=' + encodeURIComponent('Re: ' + (m.subject || 'mesajul tău către Homosapiens'));

          list.append(h('article', { class: 'mcard' + (done ? ' done' : '') },
            h('div', { class: 'mhead' },
              h('div', null, h('b', null, m.name || '(fără nume)'), h('span', { class: 'tag' }, TOPIC_RO[m.topic] || m.topic || ''), h('span', { class: 'tag ' + (done ? 'ok' : 'new') }, done ? 'Rezolvat' : 'Nou')),
              h('span', { class: 'hint' }, fmt.format(new Date(m.ts)))),
            h('p', { class: 'mmeta' }, h('a', { href: reply }, m.email || ''), [m.company, m.cui ? 'CUI ' + m.cui : '', m.role, m.phone].filter(Boolean).map((x) => ' · ' + x).join('')),
            extra.length ? h('p', { class: 'hint' }, extra.join(' · ')) : null,
            m.subject ? h('p', { class: 'msubj' }, m.subject) : null,
            h('p', { class: 'mbody' }, m.msg || ''),
            h('div', { class: 'mfoot' },
              h('span', { class: 'hint' }, m.mail && m.mail.ok ? 'Trimis și pe email.' : 'Netrimis pe email' + (m.mail && m.mail.code ? ' (' + m.mail.code + ')' : '') + '.'),
              h('div', { class: 'acts' },
                h('a', { class: 'btn btn-soft btn-sm', href: reply }, 'Răspunde'),
                h('button', { class: 'btn btn-ghost btn-sm', type: 'button', onclick: async () => {
                  const r = await api('/api/admin/messages/' + m.id + '/status', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ status: done ? 'new' : 'done' }) }).catch(() => null);
                  if (!r || !r.ok) { toast('Nu am putut schimba starea.', 'err'); return; }
                  load();
                } }, done ? 'Marchează ca nou' : 'Marchează rezolvat'),
                h('button', { class: 'btn btn-danger btn-sm', type: 'button', onclick: async () => {
                  if (!confirm('Ștergi definitiv mesajul de la ' + (m.name || 'acest vizitator') + '?')) return;
                  const r = await api('/api/admin/messages/' + m.id, { method: 'DELETE' }).catch(() => null);
                  if (!r || !r.ok) { toast('Nu am putut șterge mesajul.', 'err'); return; }
                  toast('Mesajul a fost șters.'); load();
                } }, 'Șterge')))));
        }
      } catch (e) { if (e.message !== 'auth') list.replaceChildren(h('p', { class: 'msg err' }, 'Nu am putut încărca mesajele.')); }
    };
    load();
    return box;
  }

  function focusFirst(sel) { setTimeout(() => { const el = document.querySelector(sel); if (el) el.focus(); }, 30); }
  function focusLast(sel) { setTimeout(() => { const els = document.querySelectorAll(sel); const el = els[els.length - 1]; if (el) { el.focus(); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }, 30); }

  function renderTop() {
    const who = document.getElementById('who');
    if (who) who.replaceChildren('Conectat ca ', h('b', null, S.user || ''));
  }

  function render() {
    const y = window.scrollY;
    const view = S.tab === 'echipa' ? viewTeam() : S.tab === 'roboti' ? viewRobots() : S.tab === 'contact' ? viewContact() : S.tab === 'sponsori' ? viewSponsors() : S.tab === 'mesaje' ? viewMessages() : S.tab === 'istoric' ? viewHistory() : viewAwards();
    const fmt = new Intl.DateTimeFormat('ro-RO', { dateStyle: 'medium', timeStyle: 'short' });
    app.replaceChildren(
      h('header', { class: 'top' }, h('div', { class: 'wrap top-in' },
        h('div', { class: 'brand' }, h('img', { src: '/assets/img/logo.png', alt: '' }), h('div', null, h('b', null, 'Homosapiens'), h('span', null, 'Administrare site'))),
        h('div', { class: 'top-r' },
          h('span', { class: 'who', id: 'who' }, 'Conectat ca ', h('b', null, S.user || '')),
          h('a', { class: 'btn btn-ghost btn-sm', href: '/', target: '_blank', rel: 'noopener' }, 'Vezi site-ul'),
          h('button', { class: 'btn btn-ghost btn-sm', type: 'button', onclick: async () => {
            if (isDirty() && !confirm('Ai modificări nesalvate. Ieși oricum?')) return;
            await fetch('/api/logout', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: '{}' });
            S.data = null; S.saved = ''; showLogin();
          } }, 'Ieși')))),
      h('main', { class: 'wrap' },
        h('nav', { class: 'tabs', 'aria-label': 'Secțiuni' }, TABS.map(([id, label]) => h('button', { class: 'tab' + (S.tab === id ? ' on' : ''), type: 'button', 'data-tab': id, 'aria-pressed': S.tab === id ? 'true' : 'false', onclick: () => { S.tab = id; window.scrollTo(0, 0); render(); } }, label + (id === 'mesaje' && S.msgNew ? ' (' + S.msgNew + ')' : '')))),
        S.meta ? h('p', { class: 'hint', style: 'margin-top:6px' }, 'Ultima salvare: ' + fmt.format(new Date(S.meta.ts)) + ', de ' + S.meta.who + '.') : null,
        view),
      h('div', { class: 'bar', id: 'bar' }, h('div', { class: 'bar-in' },
        h('div', { class: 'state' }, h('span', { class: 'dot' }), h('span', { id: 'bar-text' })),
        h('div', { class: 'bar-acts' },
          h('button', { class: 'btn btn-ghost', id: 'undo', type: 'button', onclick: undo }, 'Anulează'),
          h('button', { class: 'btn btn-primary', id: 'save', type: 'button', onclick: save }, 'Salvează pe site'))))
    );
    window.scrollTo(0, y);
    updateBar();
  }

  boot();
})();
</script>
</body>
</html>
